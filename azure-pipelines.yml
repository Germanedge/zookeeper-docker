variables:
  - group: Github-credentials
  - group: artifactory-docker
  - group: jira-e1platform
  - group: artifactory-maven
  - name: imageName
    value: "zookeeper"

name: "$(imageName) $(GitVersion.FullSemVer)"

trigger:
  branches:
    include:
    - develop
    - hotfix/*

pr:
  branches:
    include:
    - '*'

resources:
  repositories:
    - repository: templates
      type: github
      name: Germanedge/azure-pipelines-templates
      endpoint: Germanedge

extends:
  template: azure-pipelines-docker-template.yml@templates
  parameters:
    templateVersion: 2 
    extraDockerBuildEnvVars:
      maven_artifactory_user: $(mavenArtifactoryUser)
      maven_artifactory_password: $(mavenArtifactoryApiKey)
    extraDockerArgs: |
      --secret id=maven_artifactory_user,env=maven_artifactory_user
      --secret id=maven_artifactory_password,env=maven_artifactory_password
