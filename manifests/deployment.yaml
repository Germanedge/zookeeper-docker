apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  labels:
    app: zookeeper
    serviceType: core
    ge_domain: platform
    kafka: 'true'
    foss: 'true'
    event-bus: 'true'
    message-bus: 'true'
    java: 'true'
    orchestration: 'true'
spec:
  selector:
    matchLabels:
      app: zookeeper
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: zookeeper
        serviceType: core
        ge_domain: platform
        kafka: 'true'
        foss: 'true'
        event-bus: 'true'
        message-bus: 'true'
        java: 'true'
        orchestration: 'true'
    spec:
      imagePullSecrets:
      - name: artifactory
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        fsGroup: 1000
      volumes:
      - name: edgeone-zookeeper-pv
        persistentVolumeClaim:
          claimName: edgeone-zookeeper-pv-claim
      containers:
      - name: zookeeper
        imagePullPolicy: Always
        env:
        - name: EXT_CA_CERT
          valueFrom:
            secretKeyRef:
              name: external-ca-cert-secret
              key: ext_ca_cert
              optional: true
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        command: []
        ports:
        - containerPort: 2181
          name: port-0
        image: germanedge-docker.artifactory.new-solutions.com/edge-one/zookeeper:4.12.0
        resources:
          limits:
            memory: "512M"
            ephemeral-storage: "1200M"
          requests:
            ephemeral-storage: "1000M"
        volumeMounts:
        - mountPath: /opt/zookeeper/data
          name: edgeone-zookeeper-pv
          subPath: optzookeeperdata
---
