apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: edgeone
  labels:
    app: zookeeper
    serviceType: core
    ge_domain: platform
    kafka: 'true'
    foss: 'true'
    event-bus: 'true'
    message-bus: 'true'
    java: 'true'
    orchestration: 'true'
    ge_base_image: ge-ubuntu-generic
spec:
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
        serviceType: core
        ge_domain: platform
        kafka: 'true'
        foss: 'true'
        event-bus: 'true'
        message-bus: 'true'
        java: 'true'
        orchestration: 'true'
        ge_base_image: ge-ubuntu-generic
    spec:
      containers:
      - name: zookeeper
        image: germanedge-docker.artifactory.new-solutions.com/edge-one/zookeeper:4.24.0
        command: []
        ports:
        - name: port-0
          protocol: TCP
          containerPort: 2181
        env:
        - name: EXT_CA_CERT
          valueFrom:
            secretKeyRef:
              key: ext_ca_cert
              name: external-ca-cert-secret
              optional: true
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
              apiVersion: v1
        resources:
          limits:
            memory: "512M"
            ephemeral-storage: "1200M"
          requests:
            ephemeral-storage: "1000M"
        volumeMounts:
        - mountPath: /opt/zookeeper/data
          name: edgeone-zookeeper-pv
          subPath: optzookeeperdata
        livenessProbe:
          httpGet:
            port: 7071
            path: /metrics
            scheme: HTTP
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            port: 7071
            path: /metrics
            scheme: HTTP
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        startupProbe:
          httpGet:
            port: 7071
            path: /metrics
            scheme: HTTP
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: true
      initContainers: []
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      imagePullSecrets:
      - name: artifactory
      volumes:
      - name: edgeone-zookeeper-pv
        persistentVolumeClaim:
          claimName: edgeone-zookeeper-pv-claim
  replicas: 1
  strategy:
    type: Recreate
