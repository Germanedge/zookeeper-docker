variables:
- name: imageName
  value: zookeeper

name: '$(imageName) deploy to e1-dev (eks-1) $(Date:yyyyMMdd)$(Rev:.r)'

trigger: none
pr: none

resources:
  repositories:
    - repository: templates
      type: github
      name: Germanedge/azure-pipelines-templates
      endpoint: Germanedge
  pipelines:
    - pipeline: build-pipeline
      source: edgeone/build/Germanedge.zookeeper
      trigger:
        branches:
          include:
            - develop
        stages:
          - Publish

extends:
  template: kubernetes-deployment-template.yaml@templates
  parameters:
    # activates new template
    templateVersion: 2
    environment: edgeone-kubernetes.default
    namespace: e1-dev
    projectKey: Germanedge
    cluster: eks-1
